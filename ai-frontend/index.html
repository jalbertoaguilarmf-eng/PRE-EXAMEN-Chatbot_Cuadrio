<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Cuadrio</title>
  <style>
    :root {
      --dark: #2b2540;
      --mint: #4fe3c1;
      --mint-dark: #1fbf9d;
      --bg: #f4f4f9;
      --bubble: #e9ecef;
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .chat-container { width: 440px; max-width: 100%; height: 620px; max-height: 100vh; background: white; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }

    .chat-header { background: var(--dark); color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .chat-header h1 { font-size: 16px; margin: 0; }
    .chat-header small { display: block; font-size: 11px; color: #bdb8d6; margin-top: 2px; }
    .chat-header button { background: transparent; color: var(--mint); border: 1px solid var(--mint); border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    .chat-header button:hover { background: rgba(79,227,193,0.15); }

    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 10px 12px; border-radius: 8px; max-width: 85%; line-height: 1.45; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .user { background: var(--dark); color: white; align-self: flex-end; }
    .assistant { background: var(--bubble); color: #333; align-self: flex-start; }

    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 15px 10px; }
    .suggestions button { background: #eafaf6; color: #146b57; border: 1px solid var(--mint); border-radius: 16px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .suggestions button:hover { background: var(--mint); color: var(--dark); }

    .input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
    .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-size: 14px; }
    .input-area input:focus { border-color: var(--mint-dark); }
    .input-area button { padding: 10px 16px; background: var(--mint); color: var(--dark); font-weight: bold; border: none; border-radius: 6px; margin-left: 6px; cursor: pointer; }
    .input-area button:hover { background: var(--mint-dark); }
    .input-area button:disabled, .input-area input:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Indicador "pensando": tres puntitos que rebotan */
    .typing { display: flex; align-items: center; gap: 5px; padding: 12px 14px; }
    .typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h1>Asistente Cuadrio</h1>
        <small>Solís y Asociados S.C. · Clientes y Contribuyentes</small>
      </div>
      <button onclick="resetChat()">Nueva conversación</button>
    </div>

    <div id="chatBox" class="chat-box"></div>


    <div class="input-area">
      <input type="text" id="userInput" placeholder="Pregunta sobre tus clientes..." onkeypress="handleKeyPress(event)">
      <button id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
